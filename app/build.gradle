plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
    id 'jacoco'
    id 'io.gitlab.arturbosch.detekt'
}

android {
    namespace = 'com.grimreich'
    compileSdk = 35
    defaultConfig {
        applicationId = "com.grimreich"
        minSdk = 24
        targetSdk = 34
        versionCode = 1
        versionName = "1.0.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    buildFeatures {
        viewBinding = true
        compose = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

detekt {
    buildUponDefaultConfig = true
    allRules = false
    ignoreFailures = true
}

jacoco {
    toolVersion = "0.8.12"
}

tasks.withType(Test) {
    configure {
        destinationFile = file("build/jacoco/testDebugUnitTest.exec")
    }
}

task jacocoTestReport(type: JacocoReport, dependsOn: 'testDebugUnitTest') {
    reports {
        xml.required = true
        html.required = true
    }
    def fileFilter = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*_Factory*.*',
        '**/*_MembersInjector*.*',
        '**/*_Provide*Factory*.*',
        '**/*_Hilt*.*',
        '**/*_GeneratedInjector*.*',
        '**/*_Impl*.*',
        '**/*ViewModel*.*',
        '**/*Composable*.*',
        '**/*Screen*.*',
        '**/*Activity*.*',
        '**/*Fragment*.*',
        '**/*View*.*',
        '**/*Binding*.*',
        '**/*Dto*.*',
        '**/*Models*.*',
        '**/*-mock.class'
    ]
    def debugTree = fileTree(dir: "${buildDir}/intermediates/javac/debug/classes", excludes: fileFilter)
    def mainKotlin = fileTree(dir: "${buildDir}/tmp/kotlin-classes/debug", excludes: fileFilter)
    def generatedSources = fileTree(dir: "${buildDir}/generated", excludes: fileFilter)
    sourceDirectories.setFrom(files(["src/main/java", "src/main/kotlin"]))
    classDirectories.setFrom(files([debugTree, mainKotlin, generatedSources]))
    executionData.setFrom(file("${buildDir}/jacoco/testDebugUnitTest.exec"))
    doFirst {
        file("${buildDir}/jacoco").mkdirs()
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, excludes: fileFilter)
        }))
    }
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                minimum = 0.50
            }
        }
        rule {
            element = 'PACKAGE'
            includes = ['com.grimreich.core', 'com.grimreich.systems']
            limit {
                counter = 'LINE'
                minimum = 0.70
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.code.gson:gson:2.10.1'

    // COMPOSE
    def composeBom = platform('androidx.compose:compose-bom:2024.05.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose'
    implementation "androidx.navigation:navigation-compose:2.7.7"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"

    // DI
    implementation "com.google.dagger:hilt-android:2.55"
    ksp "com.google.dagger:hilt-android-compiler:2.55"
    testImplementation "com.google.dagger:hilt-android-testing:2.55"
    androidTestImplementation "com.google.dagger:hilt-android-testing:2.55"
    kspTest "com.google.dagger:hilt-android-compiler:2.55"
    kspAndroidTest "com.google.dagger:hilt-android-compiler:2.55"

    // SERIALIZATION
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
    testImplementation "com.google.dagger:hilt-android-testing:2.55"
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Mockito
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.2.1'
}
